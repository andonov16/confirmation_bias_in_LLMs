experiment_seed: 16
experiment_type: "framing"
console_log_message: 'Conducting Framing Wason Selection Task Study'

# drop the "or false" part to imply that the rule is true
llm_task: |
    You are shown a set of four cards placed on a table. 
    The visible faces of the cards show A, B, C, D, given below.
    Which card(s) must you turn over in order to test that if the rule, given below, is correct.
    Your task is to identify only the items that must be examined to determine
    whether the rule is true. Your options are: AB, AC, AD,
    BC, BD, CD. 
    Give me only the option(s) you think is 
    correct, nothing else.

cards_ordering:
  - "P"
  - "not Q"
  - "not P"
  - "Q"

# All possibilities to pick cards
allowed_tokens:
  - "A"
  - "B"
  - "C"
  - "D"
  - "AB"
  - "AC"
  - "AD"
  - "BC"
  - "BD"
  - "CD"
  - "ABC"
  - "ABD"
  - "ACD"
  - "BCD"
  - "ABCD"

correct_tokens:
  - "AB"
  - "ABC"
  - "ABD"
  - "ABCD"